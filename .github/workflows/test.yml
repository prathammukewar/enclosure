name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rules, geometry, AI and puzzle tests
        run: node test/test.mjs
      - name: Page elements
        run: node tools/check-ids.mjs
